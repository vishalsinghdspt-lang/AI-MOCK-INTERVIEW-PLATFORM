<!DOCTYPE html>
<html>

<head>

<title>Interview Result</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#f4f7fc;
}

.result-card{
    margin-top:50px;
    border-radius:20px;
    border:none;
}

</style>

</head>

<body>

<div class="container">

<div class="card shadow p-4 result-card">

    <h1 class="text-success">
        ✅ Interview Evaluation
    </h1>

    <div class="alert alert-info mt-3">

        AI analyzed your response and provided
        strengths, weaknesses, and improvements.

    </div>

    <hr>

    <div class="bg-light p-4 rounded">

        <pre style="white-space: pre-wrap;">
    {{ result }}
        </pre>

    </div>

    <a
        href="/"
        class="btn btn-primary">

        Start New Interview

    </a>

    <a
        href="/history"
        class="btn btn-secondary ms-2">

        📊 View Interview History

    </a>

</div>

</div>

</body>

</html>
