<!DOCTYPE html>
<html>

<head>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<title>Interview History</title>

</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        📊 Interview History
    </h1>

    <form action="/clear-history" method="post" style="margin-bottom:20px;">
        <button
            type="submit"
            onclick="return confirm('Delete all interview history?')"
            class="btn btn-danger">
            🗑 Clear All History
        </button>
    </form>

    <table class="table table-bordered table-striped">

        <thead>

            <tr>

                <th>ID</th>
                <th>Answer</th>
                <th>Evaluation</th>
                <th>Score</th>
                <th>Date</th>

            </tr>

        </thead>

        <tbody>

            {% for interview in interviews %}

            <tr>

                <td>
                    {{ interview[0] }}
                </td>

                <td>
                    {{ interview[1] }}
                </td>

                <td>
                    {{ interview[2] }}
                </td>

                <td>
                    {{ interview[3] }}
                </td>

                <td>
                    {{ interview[4] }}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
