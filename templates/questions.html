<!DOCTYPE html>
<html>

<head>

    <title>Interview Questions</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
        }

        .card-custom{
            margin-top:50px;
            border:none;
            border-radius:20px;
        }

        .question-box{
            background:#eef2ff;
            padding:20px;
            border-radius:10px;
            font-size:18px;
            font-weight:500;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card shadow p-4 card-custom">

        <div class="d-flex justify-content-between align-items-center">

            <h1 class="text-primary mb-0">
                🎤 AI Mock Interview
            </h1>

            <span class="badge bg-primary fs-6">
                Interview Round 1
            </span>

        </div>

        <p class="text-muted">
            Answer the interview question below
        </p>

        <hr>

        <h5 class="text-secondary">
            Technical Interview Question
        </h5>

        <div class="question-box">

            {{ question if question else questions }}

        </div>

        <br>

        <form action="/evaluate" method="post">

            <input
                type="hidden"
                name="question"
                value="{{ question if question else questions }}"
            >

            <label class="form-label">
                Your Answer
            </label>

            <textarea
                class="form-control"
                rows="8"
                name="answer"
                placeholder="Write your answer here..."
                required>
            </textarea>

            <br>

            <button
                type="submit"
                class="btn btn-success btn-lg px-4">

                ✅ Submit Answer

            </button>

        </form>

    </div>

</div>

</body>

</html>
