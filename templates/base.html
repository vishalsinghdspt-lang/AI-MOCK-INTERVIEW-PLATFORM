<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}AI Mock Interview{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%237667FF'/><path d='M8 16v0M12 11v10M16 7v18M20 11v10M24 16v0' stroke='white' stroke-width='2.6' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span>
    <span class="grid-lines"></span>
  </div>

  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a class="logo" href="/" aria-label="AI Mock Interview home">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 12v0M8 8v8M12 4v16M16 8v8M20 12v0"/></svg>
        </span>
        <span class="logo-text">AI Mock Interview</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/" class="{{ 'active' if active_page == 'home' }}">Home</a>
        <a href="/#features">Features</a>
        <a href="/#how">How It Works</a>
        <a href="/history" class="{{ 'active' if active_page == 'history' }}">Interview History</a>
      </nav>
      <div class="nav-right">
        <span class="status-chip"><i></i>Powered by Gemini</span>
        <a class="btn btn-primary btn-sm" href="/#start">Get Started</a>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="footer">
    <div class="container">
      <span>AI Mock Interview</span>
      <span>Practice. Get feedback. Improve.</span>
    </div>
  </footer>

  <div class="processing" id="processing" hidden>
    <div class="proc-card card-glass" role="dialog" aria-modal="true" aria-labelledby="procTitle">
      <div class="proc-wave" aria-hidden="true">{% for n in range(9) %}<span style="--i:{{ n }}"></span>{% endfor %}</div>
      <h2 id="procTitle">Working on it</h2>
      <p class="proc-msg" id="procMsg" role="status" aria-live="polite"></p>
      <div class="proc-bar" aria-hidden="true"><i></i></div>
      <p class="small muted">Please keep this page open.</p>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
