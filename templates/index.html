<!DOCTYPE html>
<html>

<head>

    <title>AI Mock Interview</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body{
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        .upload-card{

            background:white;

            width:500px;

            padding:40px;

            border-radius:20px;

            box-shadow:
            0 10px 40px rgba(
                0,
                0,
                0,
                0.3
            );

        }

    </style>

</head>

<body>

    <div class="upload-card">

        <h1
            class="text-center fw-bold">

            🎤 AI Mock Interview

        </h1>

        <p
            class="text-center text-muted">

            Upload your resume and let AI conduct your interview

        </p>

        <form
            action="/upload"
            method="post"
            enctype="multipart/form-data">

            <div class="mb-3">

                <input
                    class="form-control"
                    type="file"
                    name="resume"
                    required>

            </div>

            <button
                class="btn btn-primary w-100"
                type="submit">

                Generate Questions

            </button>

            <br><br>

            <a
                href="/history"
                class="btn btn-outline-dark w-100">

                📊 Interview History

            </a>

        </form>

    </div>

</body>

</html>
